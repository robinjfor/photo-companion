name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p _site
          cp static/index.html static/styles.css _site/
          if [ -f static/app.js ]; then cp static/app.js _site/; fi
          if [ -f static/avatar.js ]; then cp static/avatar.js _site/; fi
          if [ -f app.js ]; then cp app.js _site/; fi
          if [ -f avatar.js ]; then cp avatar.js _site/; fi
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
